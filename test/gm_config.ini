# gmrtest 配置文件 - 国密 GM/T 0005-2021 全 27 项检测
# 使用方法: 将要运行的测试项设置为 1，不需要运行的设置为 0

[gmrtest]
# 输入文件
input_file = data/random/random_000.bin

# 输出格式: text, json, csv
format = text

# 显著性水平
alpha = 0.01

# ===================== 测试项配置 =====================
# 格式: 测试项ID = 0/1 (0=禁用, 1=启用)
# ===================== 基础测试 =====================
frequency = 1                           # 1. 单比特频数检测
block_frequency-m=10000 = 1             # 2. 块内频数检测 (m=10000)

# ===================== 累加和检测 =====================
cumulative_sums-forward = 1             # 累加和检测（前向）
cumulative_sums-backward = 1            # 累加和检测（后向）

# ===================== 游程测试 =====================
runs = 1                                # 游程总数检测
runs_distribution = 1                   # 游程分布检测
longest_run-m=10000,ones = 1            # 块内最大1游程检测 (m=10000)
longest_run-m=10000,zeros = 1           # 块内最大0游程检测 (m=10000)

# ===================== 扑克检测 =====================
poker-m=4 = 1                           # 扑克检测 (m=4)
poker-m=8 = 1                           # 扑克检测 (m=8)

# ===================== 重叠子序列检测 =====================
serial-m=3 = 1                          # 重叠子序列检测 (m=3)
serial-m=5 = 1                          # 重叠子序列检测 (m=5)

# ===================== 矩阵/变换测试 =====================
rank = 1                                # 矩阵秩检测
dft = 1                                 # 离散傅立叶检测

# ===================== 模板匹配测试（NIST 项，国密不要求，默认 0） =====================
non_overlapping_template = 0            # 非重叠模板匹配
overlapping_template = 0                # 重叠模板匹配

# ===================== 熵/复杂度测试 =====================
universal = 1                           # Maurer通用统计检测 (L=7,Q=1280)
approximate_entropy-m=2 = 1             # 近似熵检测 (m=2)
approximate_entropy-m=5 = 1             # 近似熵检测 (m=5)
linear_complexity-m=500 = 1             # 线性复杂度检测 (m=500)
linear_complexity-m=1000 = 1            # 线性复杂度检测 (m=1000)

# ===================== 随机游程测试（NIST 项，国密不要求，默认 0） =====================
random_excursions = 0                   # 随机游程检测
random_excursions_variant = 0           # 随机游程变体检测

# ===================== 二元推导检测 =====================
binary_derivative-k=3 = 1               # 二元推导检测 (k=3)
binary_derivative-k=7 = 1               # 二元推导检测 (k=7)

# ===================== 自相关检测 =====================
autocorrelation-d=1 = 1                 # 自相关检测 (d=1)
autocorrelation-d=2 = 1                 # 自相关检测 (d=2)
autocorrelation-d=8 = 1                 # 自相关检测 (d=8)
autocorrelation-d=16 = 1                # 自相关检测 (d=16)
