# gmrtest 配置文件
# 使用方法: 将要运行的测试项设置为 1，不需要运行的设置为 0

[gmrtest]
# 输入文件
input_file = test/random.bin

# 输出格式: text, json, csv
format = text

# 显著性水平
alpha = 0.01

# ===================== 测试项配置 =====================
# 格式: 测试项ID = 0/1 (0=禁用, 1=启用)
# ===================== 基础测试 =====================
frequency = 1                           # 单比特频数检测
block_frequency-m=10000 = 1            # 块内频数检测 (m=10000)

# ===================== 累加和检测 =====================
cumulative_sums-forward = 0             # 累加和检测（前向）
cumulative_sums-backward = 0            # 累加和检测（后向）

# ===================== 游程测试 =====================
runs = 1                                # 游程总数检测
runs_distribution = 1                   # 游程分布检测
longest_run-m=10000,ones = 0            # 块内最大1游程检测 (m=10000)
longest_run-m=10000,zeros = 0           # 块内最大0游程检测 (m=10000)

# ===================== 扑克检测 =====================
poker-m=4 = 1                           # 扑克检测 (m=4)
poker-m=8 = 1                           # 扑克检测 (m=8)

# ===================== 重叠子序列检测 =====================
serial-m=3 = 1                          # 重叠子序列检测 (m=3)
serial-m=5 = 1                          # 重叠子序列检测 (m=5)

# ===================== 矩阵/变换测试 =====================
rank = 0                                # 矩阵秩检测
dft = 0                                 # 离散傅立叶检测

# ===================== 模板匹配测试 =====================
non_overlapping_template = 0            # 非重叠模板匹配
overlapping_template = 0                # 重叠模板匹配

# ===================== 熵/复杂度测试 =====================
universal = 0                           # Maurer通用统计检测
approximate_entropy-m=2 = 0             # 近似熵检测 (m=2)
approximate_entropy-m=5 = 0            # 近似熵检测 (m=5)
linear_complexity-m=500 = 0             # 线性复杂度检测 (m=500)
linear_complexity-m=1000 = 0            # 线性复杂度检测 (m=1000)

# ===================== 随机游程测试 =====================
random_excursions = 0                  # 随机游程检测
random_excursions_variant = 0          # 随机游程变体检测

# ===================== 其他测试 =====================
binary_derivate-k=3 = 0                 # 二元推导检测 (k=3)
binary_derivate-k=7 = 0                 # 二元推导检测 (k=7)
autocorrelation-d=1 = 0                 # 自相关检测 (d=1)
autocorrelation-d=2 = 0                 # 自相关检测 (d=2)
autocorrelation-d=8 = 0                 # 自相关检测 (d=8)
autocorrelation-d=16 = 0                # 自相关检测 (d=16)
